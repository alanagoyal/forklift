<!doctype html><html><meta charset="utf-8"><title>Forklift — live terminal recording</title><link rel="stylesheet" href="vendor/xterm.css"><style>
*{box-sizing:border-box}body{margin:0;background:#080b0e;color:#e0e4ea;font:14px monospace}#capture{width:1920px;height:1080px;transform-origin:top left;display:flex;background:#080b0e}.pane{width:960px;height:1080px;border-right:1px solid #414854}.bar{height:52px;padding:15px 20px;background:#20252d;color:#d4dbe4;font-size:20px}.term{padding:12px 16px}.xterm{height:100%}#controls{position:fixed;bottom:0;left:0;background:#20252d;padding:10px;z-index:5}button,a{font:14px monospace;color:#e0e4ea;background:#293442;border:1px solid #566478;padding:8px;cursor:pointer;text-decoration:none}#video{max-width:960px}#record{display:none}
</style><div id="capture"><div class="pane"><div class="bar">A · soft/ — archive flag</div><div class="term" id="soft"></div></div><div class="pane"><div class="bar">B · move/ — archive table</div><div class="term" id="move"></div></div></div><div id="controls"><button onclick="startRun()">Record fresh run</button> <span id="status">Connecting to real PTYs…</span> <a href="exports/forklift-terminal.mp4">Watch / download MP4</a> <a href="exports/forklift-terminal-fast.mp4">Shorter cut</a></div><canvas id="record" width="1920" height="1080"></canvas><script src="vendor/xterm.js"></script><script src="vendor/canvas.js"></script><script>
const terms={},captures={};let stage='ready',recorder,chunks=[],timer,start,recordDone=false;
for(const name of ['soft','move']){const t=new Terminal({cols:84,rows:48,fontSize:18,lineHeight:1.12,fontFamily:'Menlo,monospace',cursorBlink:false,disableStdin:true,scrollback:6000,theme:{background:'#080b0e',foreground:'#e4e8ed',green:'#a4db87',blue:'#8dbafa',cyan:'#93d4d5'}});t.open(document.getElementById(name));t.loadAddon(new CanvasAddon.CanvasAddon());terms[name]=t;new EventSource('/events/'+name).onmessage=e=>{const msg=JSON.parse(e.data);t.write(Uint8Array.from(atob(msg.data),c=>c.charCodeAt(0)))}}
function fit(){document.querySelector('#capture').style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-48)/1080)})`}onresize=fit;fit();
function compose(){const c=document.querySelector('#record'),g=c.getContext('2d');g.fillStyle='#080b0e';g.fillRect(0,0,1920,1080);['soft','move'].forEach((name,i)=>{g.fillStyle='#20252d';g.fillRect(i*960,0,960,52);g.fillStyle='#d4dbe4';g.font='20px monospace';g.fillText((i?'B · move/ — archive table':'A · soft/ — archive flag'),i*960+20,34);document.querySelectorAll('#'+name+' .xterm-screen canvas').forEach(layer=>{g.drawImage(layer,i*960+16+parseInt(layer.style.left||0),64+parseInt(layer.style.top||0),layer.width/devicePixelRatio,layer.height/devicePixelRatio)});g.fillStyle='#414854';g.fillRect(959,0,1,1080)});}
window.beginRecording=()=>{chunks=[];const stream=document.querySelector('#record').captureStream(30);recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:10000000});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:'video/webm'});document.querySelector('#status').textContent='Saving recording…';const r=await fetch('/record',{method:'POST',body:blob});window.recordResult=await r.json();window.recordDone=true;document.querySelector('#status').textContent='Recording saved';stream.getTracks().forEach(t=>t.stop())};compose();timer=setInterval(compose,33);start=performance.now();recorder.start(1000);document.querySelector('#status').textContent='Recording real terminals';return true};
window.stopRecording=()=>{if(recorder&&recorder.state==='recording'){compose();clearInterval(timer);recorder.stop()}return true};
window.startRun=async()=>{window.beginRecording();const r=await fetch('/start',{method:'POST'});return r.json()};
setInterval(async()=>{const s=await(await fetch('/status')).json();stage=s.stage;document.querySelector('#status').textContent=recordDone?'Recording saved':s.stage;if(s.stage==='complete'&&recorder?.state==='recording')window.stopRecording()},1000);
</script></html>
