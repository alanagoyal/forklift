[package]
name = "forklift"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local PostgreSQL branches and paired code/data rewind for development experiments"
license = "MIT"
repository = "https://github.com/alanagoyal/forklift"
readme = "README.md"
publish = false

[[bin]]
name = "forklift-feasibility"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=1.1.8"
zstd = "=0.13.3"

[[bin]]
name = "forklift"
path = "src/bin/forklift.rs"

[features]
test-failpoints = []

# sha2 0.10 uses its ARM SHA-256 backend only with this feature. It checks CPU
# support at runtime and retains the software fallback; digests are unchanged.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }
